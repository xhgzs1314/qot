<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>维护日志 | QOT</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .log-container {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .log-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .log-subtitle {
            color: #64748b;
            margin-bottom: 2rem;
        }


        .version-group {
            margin-bottom: 2.5rem;
        }

        .version-header {
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .version-badge {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e293b;
        }


        .log-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
        }

        .log-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .log-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.15);
            border-color: #6366f1;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .card-icon i {
            font-size: 1.4rem;
            color: white;
        }

        .log-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }

        .log-date {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .log-card p {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .log-type {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            background: #f1f5f9;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #475569;
        }

        .footnote {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="log-container">
        <h1 class="log-title"> 维护日志</h1>
        <p class="log-subtitle">版本迭代记录</p>
        <div class="version-group">
            <div class="version-header">
                <span class="version-badge">V1.x</span>
            </div>
            <div class="log-cards">
                <div data-ul="102" class="log-card">
                    <div class="card-icon"><i class="fas fa-bug"></i></div>
                    <h3>V1.02</h3>
                    <div class="log-date">2026-6-03</div>
                    <p>提升VM性能</p>
                    <span class="log-type">Well</span>
                </div>
               
            </div>
        </div>
    </div>
</body>

</html>
<script>
    document.querySelectorAll('.log-card').forEach(function (item) {
        item.addEventListener('click', function () {
            location.href = `logvm/${item.getAttribute('data-ul')}.html`;
        });
    });
</script>
