<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QOT 模块管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background: #f0f4f8;
            color: #1e2a3e;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }


        .header {
            background: #1a4a5f;
            padding: 1.5rem 2.2rem;
            color: #fff;
            border-radius: 1.5rem 1.5rem 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-weight: 600;
            font-size: 1.6rem;
        }

        .header .stats {
            font-size: 0.9rem;
            opacity: 0.85;
            background: rgba(255, 255, 255, 0.15);
            padding: 0.4rem 1rem;
            border-radius: 30px;
        }


        .toolbar {
            background: #fff;
            padding: 1rem 2rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar input {
            flex: 1;
            min-width: 200px;
            padding: 0.5rem 1rem;
            border: 1.5px solid #dce4ea;
            border-radius: 30px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .toolbar input:focus {
            border-color: #2c9b8e;
        }

        .toolbar .btn {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn-primary {
            background: #1a4a5f;
            color: #fff;
        }

        .btn-primary:hover {
            background: #1f5d74;
        }

        .btn-danger {
            background: #c0392b;
            color: #fff;
        }

        .btn-danger:hover {
            background: #e74c3c;
        }

        .btn-outline {
            background: transparent;
            color: #1a4a5f;
            border: 1.5px solid #cbdae3;
        }

        .btn-outline:hover {
            background: #eef4f7;
        }


        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem 0;
        }

        .module-card {
            background: #fff;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .module-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.10);
        }

        .card-header {
            padding: 1.2rem 1.5rem;
            background: #f8fafc;
            border-bottom: 1px solid #eef2f5;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-header .name {
            font-size: 1.15rem;
            font-weight: 600;
            color: #1a4a5f;
        }

        .card-header .name small {
            font-weight: 400;
            font-size: 0.75rem;
            color: #7e99a8;
            margin-left: 0.5rem;
        }

        .card-body {
            padding: 1.2rem 1.5rem;
            height: 500px;
            overflow-y: scroll;
        }
::-webkit-scrollbar{
    width: 8px;
    height: 8px;
    background-color: #1a5c6e;
}
        .card-body .desc {
            color: #2d4a58;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.3rem 1rem;
            font-size: 0.82rem;
            color: #3d5e6e;
            background: #f6f9fb;
            padding: 0.6rem 1rem;
            border-radius: 0.6rem;
            margin-bottom: 1rem;
        }

        .meta-grid .label {
            color: #7a98a8;
        }

        .meta-grid .value {
            font-weight: 500;
        }

        .func-list {
            margin-top: 0.5rem;
        }

        .func-list .func-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1a5c6e;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .func-list .func-title .badge {
            font-size: 0.65rem;
            background: #e6f4f0;
            color: #1e6f5c;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            font-weight: 400;
        }

        .func-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.4rem;
            font-size: 0.78rem;
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            background: #f8fafc;
            margin-bottom: 0.2rem;
        }

        .func-item .fn {
            color: #1a4a5f;
            font-weight: 500;
        }

        .func-item .params {
            color: #7a98a8;
        }

        .func-item .ret {
            color: #2c9b8e;
            font-weight: 500;
        }

        .func-item .fn-desc {
            color: #5a7a8a;
            font-size: 0.7rem;
            margin-left: auto;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-actions {
            padding: 0.8rem 1.5rem 1.2rem;
            border-top: 1px solid #eef2f5;
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
        }

        .card-actions .btn-sm {
            padding: 0.3rem 1rem;
            border: none;
            border-radius: 30px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.15s;
            font-weight: 500;
        }

        .btn-sm-danger {
            background: #fee8e6;
            color: #c0392b;
        }

        .btn-sm-danger:hover {
            background: #fcd5d2;
        }

        .btn-sm-info {
            background: #e6f0f5;
            color: #1a4a5f;
        }

        .btn-sm-info:hover {
            background: #d4e4ec;
        }


        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #7e99a8;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }


        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 1.5rem;
            padding: 2rem 2.5rem;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .modal h3 {
            margin-bottom: 0.5rem;
            color: #1a4a5f;
        }

        .modal p {
            color: #4d6e7e;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .modal .modal-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
        }

        .modal .modal-actions .btn {
            padding: 0.5rem 1.8rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
        }

        .modal .modal-actions .btn-cancel {
            background: #eef2f5;
            color: #2d4a58;
        }

        .modal .modal-actions .btn-cancel:hover {
            background: #dce4ea;
        }

        .modal .modal-actions .btn-confirm {
            background: #c0392b;
            color: #fff;
        }

        .modal .modal-actions .btn-confirm:hover {
            background: #e74c3c;
        }


        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1a4a5f;
            color: #fff;
            padding: 0.8rem 1.8rem;
            border-radius: 40px;
            font-size: 0.9rem;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
            transform: translateY(80px);
            opacity: 0;
            transition: 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: #c0392b;
        }

        .toast.success {
            background: #1e7a6a;
        }


        .loading {
            text-align: center;
            padding: 3rem;
            color: #7e99a8;
        }

        .loading .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e2e8f0;
            border-top-color: #2c9b8e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        @media (max-width: 700px) {
            .header h1 {
                font-size: 1.2rem;
            }

            .module-grid {
                grid-template-columns: 1fr;
            }

            .meta-grid {
                grid-template-columns: 1fr;
            }

            .toolbar input {
                min-width: 120px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>模块管理</h1>
            <span class="stats" id="stats">加载中…</span>
        </div>


        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="搜索模块名或描述..." oninput="filterModules()">
            <button class="btn btn-primary" onclick="loadModules()">刷新</button>
            <button class="btn btn-outline" onclick="location.href='includemodule.html'">导入模块</button>
        </div>


        <div id="moduleGrid" class="module-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top:0.8rem;">加载模块列表中…</p>
            </div>
        </div>
    </div>


    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h3> 确认删除</h3>
            <p>确定要删除模块 <strong id="deleteModuleName"></strong> 吗？<br>此操作将永久删除该模块的所有文件，不可恢复。</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-confirm" id="confirmDeleteBtn">确认删除</button>
            </div>
        </div>
    </div>


    <div class="toast" id="toast"></div>

    <script>
        let allModules = [];
        let deleteTarget = null;

        // ---------- Toast ----------
        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast ' + type;
            setTimeout(() => el.classList.add('show'), 10);
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        // ---------- 加载模块 ----------
        async function loadModules() {
            const grid = document.getElementById('moduleGrid');
            grid.innerHTML = `
            <div class="loading" style="grid-column:1/-1;">
                <div class="spinner"></div>
                <p style="margin-top:0.8rem;">加载模块列表中…</p>
            </div>
        `;

            try {
                const resp = await fetch('callback/getmodule.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ action: 'list' })
                });
                const data = await resp.json();

                if (data.success) {
                    allModules = data.data || [];
                    document.getElementById('stats').textContent = `共 ${allModules.length} 个模块`;
                    renderModules(allModules);
                } else {
                    showToast('加载失败: ' + (data.error || '未知错误'), 'error');
                    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon"></div><p>加载失败，请刷新重试</p></div>`;
                }
            } catch (err) {
                showToast('请求异常: ' + err.message, 'error');
                grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon"></div><p>网络异常，请检查连接</p></div>`;
            }
        }

        // ---------- 渲染模块 ----------
        function renderModules(modules) {
            const grid = document.getElementById('moduleGrid');

            if (!modules || modules.length === 0) {
                grid.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1;">
                    <div class="icon"></div>
                    <p>暂无已安装的模块</p>
                    <p style="font-size:0.85rem;margin-top:0.3rem;">点击「导入模块」添加</p>
                </div>
            `;
                return;
            }

            grid.innerHTML = modules.map(mod => {
                const funcs = mod.f || [];
                const author = mod.author || '未知';
                const contact = mod.ct || '无';
                const gp = mod.gp || '无';
                const desc = mod.d || '无描述';

                return `
                <div class="module-card" data-module="${mod.n}">
                    <div class="card-header">
                        <div class="name">
                            ${mod.n}
                            <small>v${mod.v || '1.0'}</small>
                        </div>
                        <span style="font-size:0.7rem;color:#7e99a8;background:#eef2f5;padding:0.15rem 0.6rem;border-radius:30px;">
                            ${funcs.length} 个方法
                        </span>
                    </div>
                    <div class="card-body">
                        <div class="desc">${desc}</div>
                        <div class="meta-grid">
                            <div><span class="label">作者</span><br><span class="value">${author}</span></div>
                            <div><span class="label">联系方式</span><br><span class="value">${contact}</span></div>
                            <div style="grid-column:1/-1;"><span class="label">仓库</span><br><span class="value" style="font-size:0.8rem;word-break:break-all;">${gp}</span></div>
                        </div>
                        <div class="func-list">
                            <div class="func-title">
                                公开方法
                                <span class="badge">${funcs.length}</span>
                            </div>
                            ${funcs.length === 0 ? '<div style="color:#7e99a8;font-size:0.8rem;padding:0.2rem 0;">暂无公开方法</div>' : ''}
                            ${funcs.map(f => `
                                <div class="func-item">
                                    <span class="fn">${f.n || 'anonymous'}</span>
                                    <span class="params">(${f.p || 'void'})</span>
                                    <span class="ret">→ ${f.r || 'void'}</span>
                                    <span class="fn-desc" title="${f.d || ''}">${f.d || ''}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-sm btn-sm-info" onclick="showModuleDetail('${mod.n}')">详情</button>
                        <button class="btn-sm btn-sm-danger" onclick="confirmDelete('${mod.n}')">删除</button>
                    </div>
                </div>
            `;
            }).join('');
        }

        // ---------- 搜索过滤 ----------
        function filterModules() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!keyword) {
                renderModules(allModules);
                return;
            }
            const filtered = allModules.filter(mod => {
                const name = (mod.n || '').toLowerCase();
                const desc = (mod.d || '').toLowerCase();
                const author = (mod.author || '').toLowerCase();
                return name.includes(keyword) || desc.includes(keyword) || author.includes(keyword);
            });
            renderModules(filtered);
        }

        // ---------- 删除 ----------
        function confirmDelete(moduleName) {
            deleteTarget = moduleName;
            document.getElementById('deleteModuleName').textContent = moduleName;
            document.getElementById('deleteModal').classList.add('active');
            document.getElementById('confirmDeleteBtn').onclick = () => doDelete(moduleName);
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deleteTarget = null;
        }

        async function doDelete(moduleName) {
            closeDeleteModal();
            showToast('正在删除 ' + moduleName + '…', 'info');

            try {
                const resp = await fetch('callback/getmodule.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'delete',
                        module: moduleName
                    })
                });
                const data = await resp.json();

                if (data.success) {
                    showToast('已删除模块: ' + moduleName, 'success');
                    loadModules(); // 刷新列表
                } else {
                    showToast('删除失败: ' + (data.error || '未知错误'), 'error');
                }
            } catch (err) {
                showToast('请求异常: ' + err.message, 'error');
            }
        }

        // ---------- 详情 ----------
        function showModuleDetail(moduleName) {
            const mod = allModules.find(m => m.n === moduleName);
            if (!mod) {
                showToast('模块不存在', 'error');
                return;
            }

            const funcs = mod.f || [];
            let funcText = funcs.map(f =>
                `  ${f.n || 'anonymous'}(${f.p || 'void'}) → ${f.r || 'void'}  ${f.d || ''}`
            ).join('\n');

            alert(
                `模块详情\n` +
                `━━━━━━━━━━━━━━━━━━━━\n` +
                `名称: ${mod.n}\n` +
                `版本: ${mod.v || '1.0'}\n` +
                `作者: ${mod.author || '未知'}\n` +
                `联系方式: ${mod.ct || '无'}\n` +
                `仓库: ${mod.gp || '无'}\n` +
                `描述: ${mod.d || '无'}\n` +
                `━━━━━━━━━━━━━━━━━━━━\n` +
                `公开方法 (${funcs.length}个):\n` +
                (funcText || '  无') +
                `\n━━━━━━━━━━━━━━━━━━━━`
            );
        }


        loadModules();


        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDeleteModal();
        });


        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeDeleteModal();
        });
    </script>

</body>

</html>
