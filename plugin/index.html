<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QOT 文档中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/qdoc.css">
    <style>
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-size: 14.5px;
        }

        .shell {
            display: flex;
            height: 100vh;
        }

        .side {
            width: 300px;
            flex: none;
            background: #fff;
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            padding: 26px 20px 16px;
        }

        .side .q-brand {
            margin-bottom: 18px;
        }

        .side .q-search {
            margin-bottom: 14px;
        }

        .menu {
            flex: 1 1 auto;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding-bottom: 8px;
            scrollbar-width: thin;
        }

        .m-group {
            margin-bottom: 16px;
        }

        .m-title {
            font: 600 10px/1 var(--sans);
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin: 0 0 8px 9px;
        }

        .m-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            color: var(--ink-2);
            text-decoration: none;
            font-size: 13.5px;
            line-height: 1.4;
            transition: background .15s, color .15s;
            cursor: pointer;
            border: 0;
        }

        .m-item i {
            width: 16px;
            flex: none;
            font-size: 12.5px;
            color: var(--ink-3);
            text-align: center;
            transition: color .15s;
        }

        .m-item:hover {
            background: #f1f4f9;
            color: var(--ink);
            border: 0;
        }

        .m-item.active {
            background: var(--accent-soft);
            color: #3730a3;
            font-weight: 600;
        }

        .m-item.active i {
            color: var(--accent);
        }

        .m-item.q-hidden {
            display: none;
        }

        .side-foot {
            border-top: 1px solid var(--line);
            padding-top: 12px;
            font-size: 11.5px;
            color: var(--ink-3);
            line-height: 1.6;
        }

        .side-foot a {
            color: var(--ink-2);
            text-decoration: none;
            border: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .side-foot a:hover {
            color: var(--accent);
        }

        .main {
            flex: 1 1 auto;
            min-width: 0;
            position: relative;
            background: var(--bg);
        }

        .frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #fff;
        }

        .loading {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            background: rgba(255, 255, 255, .86);
            backdrop-filter: blur(2px);
            z-index: 5;
        }

        .loading.show {
            display: grid;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hint {
            margin-top: 10px;
            font-size: 11px;
            color: var(--ink-3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hint kbd {
            font: 600 9.5px/1 var(--mono);
            color: #8792a6;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 3px 5px;
            background: #f8fafc;
        }
    </style>
</head>

<body>
    <div class="shell">
        <aside class="side">
            <a class="q-brand" href="index.html">
                <span class="q-brand-mark">Q</span>
                <span>
                    <span class="q-brand-name">QOT 文档中心</span>
                    <span class="q-brand-sub">Documentation</span>
                </span>
            </a>

            <div class="q-search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <circle cx="11" cy="11" r="7" />
                    <path d="M20 20l-3.6-3.6" />
                </svg>
                <input id="menuSearch" type="search" placeholder="搜索文档" autocomplete="off" spellcheck="false">
                <kbd>/</kbd>
            </div>

            <nav class="menu" id="docMenu">
                <div class="m-group">
                    <div class="m-title">入门指南</div>
                    <a class="m-item" data-page="doc.html"><i class="fas fa-file-alt"></i> 语言总述</a>
                    <a class="m-item" data-page="application.html"><i class="fas fa-rocket"></i> 实战应用</a>
                </div>
                <div class="m-group">
                    <div class="m-title">语言基础</div>
                    <a class="m-item" data-page="function_inside.html"><i class="fas fa-list"></i> 内置函数参考</a>
                    <a class="m-item" data-page="stdlib.html"><i class="fas fa-box"></i> 标准库</a>
                    <a class="m-item" data-page="demos.html"><i class="fas fa-graduation-cap"></i> 学习例子</a>
                </div>
                <div class="m-group">
                    <div class="m-title">语言进阶</div>
                    <a class="m-item" data-page="objects.html"><i class="fas fa-object-group"></i> 类与对象</a>
                    <a class="m-item" data-page="protocols.html"><i class="fas fa-link"></i> 协议元语</a>
                    <a class="m-item" data-page="macros.html"><i class="fas fa-magic"></i> 编译期宏</a>
                </div>
                <div class="m-group">
                    <div class="m-title">扩展开发</div>
                    <a class="m-item" data-page="chinese-dsl-guide.html"><i class="fas fa-language"></i> 语言扩展指南</a>
                    <a class="m-item" data-page="funcdoc.html"><i class="fas fa-plug"></i> 原生插件开发</a>
                    <a class="m-item" data-page="vgui-extension.html"><i class="fas fa-microchip"></i> Vgui 扩展开发</a>
                    <a class="m-item" data-page="shellcode.html"><i class="fas fa-shield-alt"></i> ShellCode 扩展</a>
                </div>
                <div class="m-group">
                    <div class="m-title">GUI 开发</div>
                    <a class="m-item" data-page="gui_manual.html"><i class="fas fa-paint-brush"></i> GUI 开发手册</a>
                </div>
                <div class="m-group">
                    <div class="m-title">其它</div>
                    <a class="m-item" data-page="plugins.html"><i class="fas fa-puzzle-piece"></i> 插件列表</a>
                </div>
            </nav>

            <div class="side-foot">
                <a href="../index.html"><i class="fas fa-arrow-left"></i> 返回项目根目录</a>
            </div>
        </aside>

        <main class="main">
            <div class="loading" id="loadingOverlay">
                <div class="spinner"></div>
            </div>
            <iframe id="contentFrame" class="frame" src="doc.html" title="文档内容"></iframe>
        </main>
    </div>

    <script>
        (function () {
            var frame = document.getElementById('contentFrame');
            var loading = document.getElementById('loadingOverlay');
            var items = Array.prototype.slice.call(document.querySelectorAll('.m-item'));
            var search = document.getElementById('menuSearch');

            function activate(item) {
                items.forEach(function (i) { i.classList.remove('active'); });
                if (item) item.classList.add('active');
            }

            items.forEach(function (item) {
                item.addEventListener('click', function (e) {
                    e.preventDefault();
                    var page = item.getAttribute('data-page');
                    if (!page) return;
                    activate(item);
                    loading.classList.add('show');
                    frame.src = page;
                });
            });

            frame.addEventListener('load', function () {
                loading.classList.remove('show');
            });

            activate(items.filter(function (i) {
                return i.getAttribute('data-page') === 'doc.html';
            })[0]);

            if (search) {
                search.addEventListener('input', function () {
                    var q = search.value.trim().toLowerCase();
                    items.forEach(function (item) {
                        var hit = !q || item.textContent.toLowerCase().indexOf(q) !== -1;
                        item.classList.toggle('q-hidden', !hit);
                    });
                });
                search.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') {
                        search.value = '';
                        items.forEach(function (i) { i.classList.remove('q-hidden'); });
                        search.blur();
                    }
                });
                document.addEventListener('keydown', function (e) {
                    var tag = (document.activeElement || {}).tagName;
                    if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA') {
                        e.preventDefault();
                        search.focus();
                        search.select();
                    }
                });
            }
        })();
    </script>
</body>

</html>
