# ---- O 组 网络（P0.3 · 0，docs/ §4.9；生态入口）。
#      TCP 14 + DNS 1 + UDP 3 = 18 条；tls_connect 留口 FFI（跨平台 TLS 库
#      差异大，不自研）。VM 冻结不参与（§8.7）。
#      v0 契约：句柄 = 数字（本进程槽表，1 起，close 即失效——世代断复用）；
#      失败：建/收 null、连接类 false、发送 -1、接收 ""；字符串 = 字节序列
#      （D-12）；bind 恒设 SO_REUSEADDR；v0 = AF_INET，resolve 只产 v4 面。----
