# ============================================================================
# P0.1 原语（ · CP-2 · R15 三层架构）
# ----------------------------------------------------------------------------
# 规格来源：docs/ §4（13 组/228 个原语目录）的分批 P0.1 =
# A 文件路径 + B 字符串 + D 数字 + E 数组 + F 字典。
# 通用约定（docs/ §4.0/§7，每条都适用）：
#   * 失败用哨兵不抛异常：数值 → -1；字符串 → ""；数组/字典 → null；布尔 → false
#   * 成功哨兵不与失败混淆：str_find 未命中 -1（非 0）；file_read 读空 ""（非 null）
#   * 字符串 = UTF-8 字节序列；str_len = 字节数；字符级另给 char_*
#   * 数组下标 0 起；越界读 null、越界写忽略（发布面定价）
#   * 字典键统一转字符串（数字键 5 → "5.000000"，与 dict_set 现网一致）
#   * 句柄 = 数字（不暴露平台指针）；handle_valid(h) 判定有效性
#   * 每条三件套：语义一句话（desc）/ 失败行为（desc 与实现一致）/
#     差分用例（testing/cases/native/p1x_*.qot + test_primitive_oracle_diff.py）
# VM 冻结（§8.7）：engines 一律不含 vm；解释器 oracle 同批实现（primitives.py）。
# 现有 sqrt/pow/rand/round/min/max/sum 是**任务级老函数**（sqrt(x,n) 是 N 次
# 方根、pow 仅整数），语义与原语目录不同名不同义 —— 不动它们，P0-D 全走新
# 规范名；旧名迁移归 M5 命名规范化（docs/ §6）。
# ============================================================================

# ---- P0-A 文件与路径（docs/ §4.1）----
# 文件原语一律**字节语义**（无文本模式换行翻译，§8 跨平台表：换行保留原始
