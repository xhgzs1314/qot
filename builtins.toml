# ============================================================================
# QOT 内置函数单一清单
# ============================================================================
#
# 用法与纪律：
#   1. 改内置（增删改名/改参数/改引擎归属）→ 只改本文件；
#   2. 然后跑 `python _gen_builtins.py`（重生成 VM 侧
#      `ot-asset/c/vmcshit/builtins_manifest.h`）；
#   3. 然后跑 `python _dbg_builtins.py`（三侧对账，任何一侧漏注册都报错）；
#   4. 最后 `python testing/run.py --suite all`。
#
# 字段（parser 见 `qot_toml.py`，支持面之外一律报错，不静默误读）：
#   name      规范名（当前实现名；M5 命名规范化时再翻转新旧）
#   group     分组（io/convert/container/string/file/time/math/http/process/
#             shellcode/json/encoding/web/gui/internal/ffi/net/misc）
#   engines   该内置在哪些引擎可用：interp / vm / native（子集，可多个）
#   argc      参数个数（-1 = 可变；语义分析按它校验）
#   args      形参类型提示（语义分析用）
#   ret       返回类型提示
#   interp    解释器侧实现：handler 名，或 "@unsupported"（解释器无实现 →
#             自动登记一个报错桩，给出"该内置在此引擎不可用"的明确错误，
#             而不是让语义分析报"函数未定义"把真正的引擎归属问题藏起来）
#   vm        VM 侧 C++ 函数符号（builtin.cpp 的 registerFunction 实参）
#   native    AOT 侧 qotrt 符号后缀（qotrt_<native>）
#   aliases   兼容别名（旧名/新名互迁；QOT_NO_ALIAS=1 可整体关掉做 A/B）
#   numeric   可返回数值 → 进 lir_opt 的 F64 推断白名单
#   alloc_free 不产出 arena 块 → 进 arena 染色白名单（循环回收的安全前提）
#   mutates_container 把实参存进容器（args[0] 容器，args[1:] 为被存值）→
#             循环 arena 回收的【内容逃逸面】：槽级逃逸分析看不见容器内容，
#             体内出现这类调用且容器可能跨轮存活时必须整体否决插桩
#             （P0-POOL-1 的根因之一，见 lir_opt.arena_loops 契约）
#   calls_back 在 native 侧执行 QOT 闭包回调（map/filter/reduce/sort_by）→
#             循环 arena 回收按 CALL_USER 同类否决（回调体可把 arena 块
#             存进任何跨轮容器，插桩期无法证明其不逃逸）
#   stub_hint 解释器报错桩的附加提示语
#   desc      一句话说明
#
# ============================================================================

[[builtin]]
name = "output"
group = "io"
engines = ["interp", "vm", "native"]
argc = -1
args = ["any"]
ret = "unknown"
interp = "output_handler"
vm = "builtin_output"
native = "output"
alloc_free = true
desc = "打印实参（空格分隔）并换行"

